# Grafana alert rules for the couch system - import via
# Alerting -> Alert rules -> Import (or the provisioning API).
# Full setup: docs/grafana-implementation.md
#
# THE ONE THING TO GET RIGHT ------------------------------------------------
# There are two kinds of rule in here and they need OPPOSITE no-data handling:
#
#   PRESENCE rules ("something bad happened") - launch_failed, crash_loop,
#   error_burst, exlink_nak. Their query returns a count; the alert fires when
#   it exceeds a threshold. No data means nothing bad happened, which is GOOD
#   NEWS, so noDataState: OK. Setting these to Alerting would page every quiet
#   night.
#
#   ABSENCE rules ("something stopped") - voice_lane_down, chord_lane_down.
#   A dead lane emits NO lines at all, so the query returns NO SERIES and the
#   `< 1` threshold never evaluates. These fire through noDataState: Alerting.
#   The threshold is only a backstop for a lane that is ticking but starved.
#   Set these to OK and the two most valuable alerts in the system are
#   permanently inert - and they LOOK fine in the UI, which is why drill 4
#   (kill the agent, confirm it pages) is not optional.
#
# Every rule filters env="prod". The blind suite writes env=test to a separate
# file the shipper does not even read, so this is belt-and-braces.
apiVersion: 1

groups:
  - orgId: 1
    name: couch-liveness
    folder: slopstation
    # 1m evaluation: the cost of a slow page is a cold TV; the cost of a fast
    # one is nothing. Loki queries this small are free at our volume.
    interval: 1m
    rules:

      # ------------------------------------------------------------------
      # The load-bearing lane. If this dies the chord is deaf and the only
      # way anyone finds out is by pressing it from the couch and getting
      # nothing. This is the single most valuable rule here.
      # ------------------------------------------------------------------
      - uid: couch-chord-lane-down
        title: Chord lane down
        condition: C
        for: 2m            # one missed tick is noise; two minutes is real
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No heartbeat from the chord listener in 5 minutes. The chord is
            probably deaf. Check Start-Listener.bat on the K15, or that the
            K15 is powered on at all.
          runbook_url: https://github.com/trillville/slopstation/blob/main/docs/troubleshooting.md
        labels:
          severity: critical
          lane: listener
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-logs
            model:
              refId: A
              # instant, not range: we want one number for "now", and a range
              # query would hand the reducer a series that is empty in a way
              # that is harder to reason about.
              queryType: instant
              expr: >-
                sum(count_over_time({service="k15", lane="listener", env="prod"}
                | json | event="heartbeat" [5m]))
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, reducer: last, expression: A}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}

      # ------------------------------------------------------------------
      # The overlay. Losing it costs voice control, never a launch - so it is
      # a warning, not a critical, and it waits longer before paging.
      # ------------------------------------------------------------------
      - uid: couch-voice-lane-down
        title: Voice lane down
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: OK          # a query blip must not page for an overlay
        annotations:
          summary: >-
            No heartbeat from the voice agent in 5 minutes. Wake word is deaf;
            the chord lane is unaffected. Check voice\Start-Voice.bat.
        labels:
          severity: warning
          lane: voice
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-logs
            model:
              refId: A
              queryType: instant
              expr: >-
                sum(count_over_time({service="k15", lane="voice", env="prod"}
                | json | event="heartbeat" [5m]))
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, reducer: last, expression: A}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}

  - orgId: 1
    name: couch-failures
    folder: slopstation
    interval: 1m
    rules:

      # ------------------------------------------------------------------
      # A launch that died. The turn id is in the log line, so the alert is
      # one query away from the whole story across both machines.
      # ------------------------------------------------------------------
      - uid: couch-launch-failed
        title: Launch failed
        condition: C
        for: 0m            # one failure is worth knowing about immediately
        noDataState: OK    # no failures = good news, NOT an alert
        execErrState: OK
        annotations:
          summary: >-
            A launch failed. Query {service="k15"} | json | turn="<turn>" to
            get the whole story, including the gaming PC's half.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-logs
            model:
              refId: A
              queryType: instant
              expr: >-
                sum(count_over_time({service="k15", env="prod"}
                | json | event="launch_failed" [5m]))
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, reducer: last, expression: A}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}

      # ------------------------------------------------------------------
      # A supervisor dutifully restarting something that keeps dying. This is
      # the failure mode that crash-looped the voice agent on 2026-08-11 and
      # was visible ONLY to whoever happened to be watching a console.
      # ------------------------------------------------------------------
      - uid: couch-crash-loop
        title: Crash loop
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: >-
            A lane has restarted more than 3 times in 10 minutes - its
            supervisor is relaunching something that keeps dying. Check the
            `what` and `code` fields, then that lane's recent errors.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: grafanacloud-logs
            model:
              refId: A
              queryType: instant
              expr: >-
                sum(count_over_time({service="k15", lane="supervisor", env="prod"}
                | json | event="restart" [10m]))
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, reducer: last, expression: A}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [3]}

      # ------------------------------------------------------------------
      # Something is wedged and retrying. Note this selects on the `level`
      # LABEL rather than parsing JSON - the payoff for keeping labels to
      # four low-cardinality fields back in E0.
      # ------------------------------------------------------------------
      - uid: couch-error-burst
        title: Error burst
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: >-
            More than 5 errors in 10 minutes. Query
            {service="k15", level="error"} to see what is repeating.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: grafanacloud-logs
            model:
              refId: A
              queryType: instant
              expr: >-
                sum(count_over_time({service="k15", env="prod", level="error"} [10m]))
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, reducer: last, expression: A}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [5]}

      # ------------------------------------------------------------------
      # The TV stopped answering on the serial line. Usually the SH-U35B
      # adapter or a COM port that moved.
      # ------------------------------------------------------------------
      - uid: couch-exlink-nak
        title: TV not answering (Ex-Link NAK)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: >-
            The TV did not ack an Ex-Link frame. Check the SH-U35B adapter and
            that tvComPort in config.json still matches Device Manager.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-logs
            model:
              refId: A
              queryType: instant
              expr: >-
                sum(count_over_time({service="k15", env="prod"}
                | json | event="exlink_nak" [5m]))
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, reducer: last, expression: A}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}

# TODO(E4): once the gaming PC ships, add a rule on
#   {service="gamepc", env="prod"} | json | event="enter_failed"
# It is currently covered indirectly - couch.py raises launch_failed when the
# host never reports READY - but the PC's own reason string is more useful
# than "host never reported READY".
#
# TODO(E5): daily LLM spend, once token counts are emitted as fields. Until
# then there is nothing to sum, and a rule with no data would look armed
# while measuring nothing.
