[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slopstation"
version = "0.1.0"
description = "Couch gaming on the K15: the chord listener, the voice agent, and the launch path to the gaming PC"
readme = "README.md"
# Match the Python version used to generate constraints.txt.
requires-python = ">=3.13"

dependencies = [
  # Recheck service compatibility before changing Pipecat.
  "pipecat-ai[local,silero,deepgram,anthropic,openai,tracing]==1.8.1",
  # Sentry uses the HTTP OTLP exporter.
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  # Avoid the aggregate OTLP extra, which adds separately resolved packages.
  "sentry-sdk==2.68.1",
  "openwakeword==0.6.0",
  "hassil==3.12.0",
  "rapidfuzz==3.14.6",
  "pyserial==3.5",  # the TV's Ex-Link serial path
  "hidapi",  # the Steam Puck; NOT the 'hid' package, a different project
  # Used directly even though Pipecat also installs them transitively.
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "howlongtobeatpy==1.0.23",  # completion times; imported only when used
  "samsungtvws==3.0.5",  # mute and manual TV remote keys
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.16",
  "mypy==2.3.1",
]

[project.scripts]
# Command-line entry points.
slopstation-lane = "slopstation.supervise:lane_main"
slopstation-start = "slopstation.supervise:start"
slopstation-doctor = "slopstation.doctor:main"
slopstation-text = "slopstation.text_client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slopstation = ["agent/grammar.yaml", "agent/models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from the current checkout before any editable install.
pythonpath = ["src", "tests"]
addopts = "-ra"
# Run async tests without per-test markers.
asyncio_mode = "auto"

[tool.ruff]
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
# Pyflakes, pycodestyle errors, import order, upgrades, and bugbear.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src"]
ignore_missing_imports = true
# Check function bodies that lack annotations.
check_untyped_defs = true
warn_unused_ignores = true
