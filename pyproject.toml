[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slopstation"
version = "0.1.0"
description = "Couch gaming on the K15: the chord listener, the voice agent, and the launch path to the gaming PC"
readme = "README.md"
# Tracks the K15's interpreter, not a floor: constraints.txt is frozen from
# that venv, so an older one cannot resolve it.
requires-python = ">=3.13"

dependencies = [
  # Pipecat moves weekly: re-read its docs for every service used and re-run
  # the suite before bumping. 1.7.0 -> 1.8.1 was the proposed-turn-frame
  # rework; grammar_gate and session_runtime carry the compensations.
  "pipecat-ai[local,silero,deepgram,anthropic,openai,tracing]==1.8.1",
  # Sentry's OTLP endpoint is HTTP-only (no gRPC), and pipecat's own tracing
  # example imports the gRPC exporter - pin http so it cannot resolve by
  # accident. (In constraints.txt, semantic-conventions 0.65b0 is sdk
  # 1.44.0's lockstep partner under its own 0.x scheme.)
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  # Errors as Issues, plus OTLPIntegration's event linking (an exception lands
  # on the span it broke). NO [opentelemetry-otlp] extra: that pulls
  # opentelemetry-distro, which resolves its own otel versions against the pin
  # above. The integration's imports are already satisfied by that exporter
  # and opentelemetry-sdk - if a future version needs the extra, it raises
  # DidNotEnable and telemetry/sentry.py logs lane_disabled rather than
  # crashing.
  "sentry-sdk==2.68.1",
  "openwakeword==0.6.0",
  "hassil==3.12.0",
  "rapidfuzz==3.14.6",
  # The TV's Ex-Link serial path (tv.py, exlink.py).
  "pyserial==3.5",
  # The Steam Puck over HID. hidapi, NOT the 'hid' package - different
  # project, same import name.
  "hidapi",
  # grammar_gate.py imports yaml at MODULE scope to read grammar.yaml. It
  # arrives as a pipecat transitive; named here so a pipecat that drops it
  # fails at install rather than at the first wake word.
  "PyYAML==6.0.3",
  # steam_session.py imports it lazily, as do library.py and steamstore.py.
  # Also a pipecat transitive today; same reason to name it.
  "requests==2.34.2",
  # how-long-to-beat hours (assistant game-details facet). library.py imports
  # it lazily and fail-soft.
  "howlongtobeatpy==1.0.23",
  # TV remote keys over WebSocket (tv_remote.py) - the volume write path that
  # works with eARC audio; imported lazily and fail-soft.
  "samsungtvws==3.0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.16",
  "mypy==2.3.1",
]

[project.scripts]
# What the two scheduled tasks run (Setup-K15-Tasks.ps1) ...
slopstation-lane = "slopstation.supervise:lane_main"
# ... and what Start-Slopstation.bat runs to start or reload them.
slopstation-start = "slopstation.supervise:start"
slopstation-doctor = "slopstation.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slopstation = ["agent/grammar.yaml", "agent/models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
# The pre-roll pipeline tests are coroutines; auto mode runs them without
# a marker on each one.
asyncio_mode = "auto"

[tool.ruff]
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
# pyflakes and the pycodestyle errors, import order, modern syntax, and the
# bugbear set. Style beyond that is the formatter's job.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src"]
ignore_missing_imports = true
# Most of the code is unannotated; without this mypy skips those bodies and
# passes vacuously.
check_untyped_defs = true
warn_unused_ignores = true
