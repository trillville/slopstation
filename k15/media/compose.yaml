name: slopstation-media

# Tags are frozen BY HAND from the K15, the constraints.txt rule: pin what is
# RUNNING there, never upstream latest (the runbook's Pinning section has the
# procedure). ':latest' means nobody has frozen yet, and the next
# `docker compose pull` upgrades all four services at once.

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-America/Los_Angeles}
    expose:
      - "8191"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - type: bind
        source: ${MEDIA_CONFIG_ROOT}/prowlarr
        target: /config
    ports:
      - 127.0.0.1:9696:9696
    depends_on:
      - flaresolverr

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - type: bind
        source: ${MEDIA_CONFIG_ROOT}/radarr
        target: /config
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
    ports:
      - 127.0.0.1:7878:7878

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - type: bind
        source: ${MEDIA_CONFIG_ROOT}/sonarr
        target: /config
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
    ports:
      - 127.0.0.1:8989:8989
