name: slopstation-media

# Tags are frozen BY HAND from the K15, the constraints.txt rule: pin what is
# RUNNING there, never upstream latest (the runbook's Pinning section has the
# procedure). ':latest' means nobody has frozen yet, and the next
# `docker compose pull` upgrades all seven services at once.

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-America/Los_Angeles}
    expose:
      - "8191"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - type: bind
        source: ${MEDIA_CONFIG_ROOT}/prowlarr
        target: /config
    ports:
      # LAN-wide so dashboard links resolve from other machines; every UI
      # below authenticates, and the runbook's firewall rules scope them to
      # LocalSubnet on the Private profile. Never the internet.
      - 9696:9696
    depends_on:
      - flaresolverr

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - type: bind
        source: ${MEDIA_CONFIG_ROOT}/radarr
        target: /config
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
    ports:
      - 7878:7878

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - type: bind
        source: ${MEDIA_CONFIG_ROOT}/sonarr
        target: /config
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
    ports:
      - 8989:8989

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    environment:
      # 64 hex chars; Start-Media.ps1 generates it into .env. Changing it
      # orphans every credential Homarr has stored.
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - type: bind
        source: ${MEDIA_CONFIG_ROOT}/homarr
        target: /appdata
      # Docker-containers widget. The socket grants container control, so
      # board actions stay auth-gated; anonymous viewers are read-only.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    ports:
      # Host 8575 because VirtualHere owns 7575.
      - 8575:7575

  scrutiny:
    # SMART history UI (web + its InfluxDB). The collector is NOT in here:
    # Docker Desktop's VM never sees the physical drives, so a scheduled task
    # on the K15 runs native smartctl and posts to the API - runbook, "Disk
    # and SMART". Web and API share container port 8080.
    image: ghcr.io/analogj/scrutiny:master-omnibus
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - type: bind
        source: ${MEDIA_CONFIG_ROOT}/scrutiny/config
        target: /opt/scrutiny/config
      - type: bind
        source: ${MEDIA_CONFIG_ROOT}/scrutiny/influxdb
        target: /opt/scrutiny/influxdb
    ports:
      # LAN-wide: Homarr's iFrame widget loads it in the viewer's browser.
      - 8085:8080

  glances:
    # Feeds Homarr's system-resources and disk widgets. Internal-only:
    # Homarr polls http://glances:61208 server-side.
    image: nicolargo/glances:latest-full
    restart: unless-stopped
    environment:
      GLANCES_OPT: -C /etc/glances.conf -w
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - type: bind
        source: ./glances.conf
        target: /etc/glances.conf
        read_only: true
      # statvfs on these binds is what reports each volume's real fill;
      # glances.conf documents the 9p allow that makes them visible.
      - type: bind
        source: ${MEDIA_ROOT}
        target: /mnt/media
        read_only: true
      - type: bind
        source: ${MEDIA_CONFIG_ROOT}
        target: /mnt/k15-system
        read_only: true
    expose:
      - "61208"
