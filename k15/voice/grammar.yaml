# The command grammar (hassil). Every final transcript is screened against this
# BEFORE any LLM. Slot lists are supplied at runtime (config inputs map /
# library titles), so installing a game needs no edit here. EndSession stays
# narrow (risky command, no fuzz); ExitSession = "conversation over", not a
# system action.
language: en
intents:
  StartSession:
    data:
      - sentences:
          - "start [a|the] [gaming] session"
          - "game time"
          - "let's play"
  # Real phrasings only. The mishears logged alongside them ("end of session",
  # "access session", "I'm the session") are deliberately NOT encoded.
  EndSession:
    data:
      - sentences:
          - "end [the] [gaming] session"
          - "stop [the] [gaming] session"
          - "exit [the] [gaming] session"
          - "exit (gaming|tv) mode"
          - "we're done [gaming|playing]"
  VolumeUp:
    data:
      - sentences:
          - "[turn [the]] volume up"
          - "turn it up"
          - "louder"
  VolumeDown:
    data:
      - sentences:
          - "[turn [the]] volume down"
          - "turn it down"
          - "quieter"
          - "softer"
  VolumeSet:
    data:
      - sentences:
          - "[set [the]] volume [to] {level}"
  MuteToggle:
    data:
      - sentences:
          - "mute [the] [tv|sound|audio]"
          - "unmute [the] [tv|sound|audio]"
  SwitchInput:
    data:
      - sentences:
          - "switch [over] to [the] {input}"
          - "go [back] to [the] {input}"
          - "show [the] {input}"
  # Big Picture nav to a FIXED target. {target} is a runtime list
  # (config.navTargets) whose value is the nav KIND, vocab disjoint from
  # {input}; wildcards match later, so no collision. Game- and store-page nav
  # need title resolution and belong to the assistant lane.
  Nav:
    data:
      - sentences:
          - "[(can|could) you] show [me] [the] {target}"
          - "[(can|could) you] open [the] {target}"
          - "[(can|could) you] go to [the] {target}"
          - "[(can|could) you] take me to [the] {target}"
  ExitSession:
    data:
      - sentences:
          - "thanks"
          - "thank you"
          - "that's all"
          - "that is all"
          - "never mind"
          - "nevermind"
          - "cancel"
          - "go back to sleep"
          # Safe to widen: closes the conversation, touches nothing in the room.
          - "go away"
          - "leave me alone"
          - "shut up"
  # Background tasks. "cancel" alone stays ExitSession; conversational
  # phrasings ("tell me more") must fall through to the assistant lane.
  TaskResult:
    data:
      - sentences:
          - "what did you find [out]"
          - "any updates [on the (task|research)]"
          - "task update"
  TaskDetail:
    data:
      - sentences:
          - "[give me] the details"
          - "task details"
  TaskCancel:
    data:
      - sentences:
          - "cancel the (task|research|job)"
  # Collections by name. Wildcard, so it sits down here with PlayGame.
  # Requiring "my" or "collection" keeps a bare "show me <game>" out; a
  # resolver miss falls through to the assistant.
  ShowCollection:
    data:
      - sentences:
          - "show [me] my {collection}"
          - "show [me] [my|the] {collection} collection"
          - "open [my|the] {collection} collection"
          - "go to [my|the] {collection} collection"
  # LAST on purpose: {game} is a wildcard, so "start a session" must hit
  # StartSession above before "start {game}" eats it. Title resolution is
  # titles.py's job. Widening is safe here - every list-slot intent above
  # claims its phrasing before this wildcard is reached.
  PlayGame:
    data:
      - sentences:
          - "(play|launch|start|put on|open) [the game] {game}"
          - "[i] (want to|wanna|would like to) (play|launch|start|put on|open) [the game] {game}"
          - "let's (play|launch|start|put on) [the game] {game}"
          # No "start" here: StartSession has no "can you" variant to win
          # with, so "can you start the session" matched game="the session".
          - "can you (play|launch|put on|open) [the game] {game}"
lists:
  level:
    range:
      type: number
      from: 0
      to: 100
  game:
    wildcard: true
  collection:
    wildcard: true
