# CI-only (never installed on either machine). Lenient by choice: it holds
# the existing annotations consistent; it does not demand new ones.
# The version tracks the K15's interpreter, not a floor: constraints.txt
# is frozen from that venv, and a cp313 pin has no wheel for an older CI.
[mypy]
python_version = 3.13
ignore_missing_imports = True

# tests/ and bench/ are not packages, but a directory argument crawls them
# anyway. Excluding tests/ keeps `mypy k15/agent` at the same modules the old
# file list named. worker_home/ and models/ are runtime scratch.
exclude = (^|[\\/])(tests|worker_home|models)([\\/]|$)
