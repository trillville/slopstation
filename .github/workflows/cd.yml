name: cd

# Self-hosted runners poll GitHub because neither machine accepts inbound
# connections. Deploy only after CI succeeds on a push to this repository.
# The event guard prevents code from fork pull requests reaching the runners.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Both runners use Windows PowerShell 5.1 rather than pwsh.
defaults:
  run:
    shell: powershell

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # Job timeouts must exceed the wait for an active couch session.
  WAIT_MINUTES: "120"

jobs:
  # Use separate queues so an offline gaming PC does not block K15 deploys.
  gaming-pc:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push') }}
    runs-on: [self-hosted, gamepc]
    concurrency:
      group: cd-gamepc
      cancel-in-progress: false
    timeout-minutes: 150
    steps:
      # Deploy.ps1 ships from a checkout and stamps that checkout's rev, so the
      # runner workspace must sit on the commit being deployed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: deploy
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\gaming-pc\Deploy.ps1 -WaitMinutes $env:WAIT_MINUTES
      # Exit code = its FAIL count.
      - name: doctor
        run: powershell -NoProfile -ExecutionPolicy Bypass -File C:\CouchGaming\Doctor.ps1

  # Deploy independently because the gaming PC runner is often offline.
  k15:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push') }}
    runs-on: [self-hosted, k15]
    concurrency:
      group: cd-k15
      cancel-in-progress: false
    timeout-minutes: 150
    steps:
      # deploy.py updates the live checkout that owns the session lock.
      - name: deploy and doctor
        run: |
          & "$env:SLOP_HOME\.venv\Scripts\python.exe" -m slopstation.deploy --sha $env:SHA --wait-minutes $env:WAIT_MINUTES
        env:
          SLOP_HOME: ${{ vars.K15_CHECKOUT || 'C:\Users\minipc\Desktop\slopstation' }}
