name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tests use Windows paths and PowerShell. Python 3.13 matches constraints.txt.
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.16"
      - run: ruff check .
      - run: ruff format --check .

  types:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      # Install application dependencies so mypy sees third-party types.
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: mypy
