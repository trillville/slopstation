name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The blind suite, exactly as the README documents it. windows-latest is
  # required: the tests assume Windows paths and test_ps_parse shells to the
  # real PowerShell parser. test_library and test_session_pipeline self-skip
  # (no Steam, no audio devices on a runner).
  # 3.13 because that is what the K15 runs. constraints.txt is frozen from
  # that venv, so an older CI cannot resolve it - scipy 1.18.0 ships no
  # cp311 wheel, which is how the mismatch surfaced.
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: pytest

  types:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      # The whole dependency set, not mypy alone: without the real third-party
      # stubs every external call is Any and the check passes vacuously.
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: mypy
