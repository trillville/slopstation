name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # windows-latest is required: the tests assume Windows paths and
  # test_ps_parse shells to the real PowerShell parser. The Steam and audio
  # tests self-skip. 3.13 because that is what the K15 runs: constraints.txt
  # is frozen from that venv, so an older interpreter cannot resolve it.
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.16"
      - run: ruff check .
      - run: ruff format --check .

  types:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      # The whole dependency set, not mypy alone: without the real third-party
      # stubs every external call is Any and the check passes vacuously.
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: mypy
